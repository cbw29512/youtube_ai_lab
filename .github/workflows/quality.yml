name: YouTube AI Lab Release Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python source
        run: python -m compileall -q backend tests scripts

      - name: Run offline release contract
        run: python -m unittest tests.test_release_contract -v

      - name: Validate committed configuration
        run: python -m json.tool config/config.json >/dev/null

      - name: Reject generated media, credentials, and local databases
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)(youtube_secrets\.json|token\.pickle|\.env)$|\.(mp4|wav|mp3|db|sqlite|sqlite3)$|(^|/)data/(videos|audio/cache|logs)/' || true)"
          if [[ -n "$bad" ]]; then
            echo 'Generated media, credentials, or local runtime data is tracked:'
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Install dependency auditor
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Audit pinned Python dependencies
        run: pip-audit -r requirements.txt
