<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube AI Lab</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 10px; }
        .tagline { text-align: center; font-size: 1.2rem; margin-bottom: 30px; opacity: 0.9; }
        .request-form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .request-form h2 { margin-bottom: 15px; }
        textarea {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            min-height: 100px;
        }
        button {
            background: #4ade80;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #22c55e; }
        .btn-reject { background: #ef4444; }
        .btn-reject:hover { background: #dc2626; }
        .requests-list {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
        }
        .request-item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .request-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .request-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .status-pending { background: #fbbf24; color: #000; }
        .status-processing { background: #3b82f6; color: #fff; }
        .status-approved { background: #4ade80; color: #000; }
        .request-text { font-size: 1.1rem; margin: 15px 0; }
        .request-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-approve { background: #4ade80; flex: 1; }
        .progress-container {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        video {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            margin: 15px auto;
            display: block;
        }
        .script-text {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 YouTube AI Lab</h1>
        <p class="tagline">Request Approval System</p>
        
        <div class="request-form">
            <h2>Submit Test Request</h2>
            <textarea id="requestText" placeholder="Type a request..."></textarea>
            <button onclick="submitRequest()">Submit Request</button>
        </div>
        
        <div class="requests-list">
            <h2>Requests Queue</h2>
            <div id="requestsList">Loading...</div>
        </div>
    </div>
    
    <script>
        console.log('🚀 App loaded');
        const socket = io();
        
        socket.on('progress', (data) => {
            updateProgress(data.request_id, data.progress, data.message);
        });
        
        socket.on('video_complete', () => setTimeout(loadRequests, 500));
        
        function loadRequests() {
            console.log('Loading requests...');
            fetch('/api/requests')
                .then(r => r.json())
                .then(requests => {
                    console.log('Loaded:', requests.length);
                    const container = document.getElementById('requestsList');
                    
                    if (requests.length === 0) {
                        container.innerHTML = '<p>No requests yet</p>';
                        return;
                    }
                    
                    container.innerHTML = requests.map(req => `
                        <div class="request-item">
                            <div class="request-header">
                                <span>Request #${req.id}</span>
                                <span class="request-status status-${req.status}">${req.status.toUpperCase()}</span>
                            </div>
                            <div class="request-text">${req.request_text}</div>
                            
                            ${req.status === 'pending' ? `
                                <div class="request-actions">
                                    <button class="btn-approve" onclick="approveRequest(${req.id})">✅ Approve & Generate</button>
                                    <button class="btn-reject" onclick="deleteRequest(${req.id})">❌ Reject</button>
                                </div>
                            ` : ''}
                            
                            ${req.status === 'processing' ? `
                                <div class="progress-container">
                                    <div id="progress-msg-${req.id}">Processing...</div>
                                    <div class="progress-bar">
                                        <div class="progress-fill" id="progress-${req.id}" style="width: ${req.progress}%">${req.progress}%</div>
                                    </div>
                                </div>
                            ` : ''}
                            
                            ${req.video_path ? `
                                <video controls><source src="/videos/${req.video_path}" type="video/mp4"></video>
                                ${req.script ? `<div class="script-text">📝 ${req.script}</div>` : ''}
                                <button class="btn-reject" onclick="deleteRequest(${req.id})">🗑️ Delete</button>
                            ` : ''}
                        </div>
                    `).join('');
                });
        }
        
        function updateProgress(id, progress, msg) {
            const fill = document.getElementById(`progress-${id}`);
            const msgEl = document.getElementById(`progress-msg-${id}`);
            if (fill) {
                fill.style.width = progress + '%';
                fill.textContent = progress + '%';
            }
            if (msgEl) msgEl.textContent = msg;
        }
        
        function submitRequest() {
            const text = document.getElementById('requestText').value.trim();
            if (!text) return alert('Enter a request');
            
            console.log('Submitting:', text);
            fetch('/api/requests', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({request_text: text})
            })
            .then(r => r.json())
            .then(() => {
                document.getElementById('requestText').value = '';
                loadRequests();
            });
        }
        
        function approveRequest(id) {
            console.log('APPROVING:', id);
            fetch(`/api/requests/${id}/approve`, {method: 'POST'})
                .then(r => {
                    console.log('Response status:', r.status);
                    return r.json();
                })
                .then(data => {
                    console.log('Approved!', data);
                    loadRequests();
                })
                .catch(err => console.error('ERROR:', err));
        }
        
        function deleteRequest(id) {
            console.log('DELETING:', id);
            fetch(`/api/requests/${id}/delete`, {method: 'POST'})
                .then(() => loadRequests());
        }
        
        loadRequests();
        setInterval(loadRequests, 30000);
    </script>
</body>
</html>
